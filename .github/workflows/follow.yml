name: follow
# Auto-follow (scripts/auto_follow.py): at most 1 follow per run, paced to about 100 a day between 09:00 and 22:00
# Beijing. Runs right after every posting run, which cron-job.org starts every 5 minutes. Only one run at a time.
on:
  workflow_run:
    workflows: [post]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print who would be followed"
        type: boolean
        default: false
concurrency:
  group: follow
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Follow one candidate
        run: python3 scripts/auto_follow.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save log
        if: always() && !inputs.dry_run
        run: |
          git config user.name "x-ops bot"
          git config user.email "x-ops-bot@users.noreply.github.com"
          git add data/follow
          git diff --cached --quiet && exit 0
          git commit -q -m "Record follows"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
