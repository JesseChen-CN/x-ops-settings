name: send-replies
# Sends queued replies as soon as a Claude session pushes them (repo_sync.py reply / reply-batch).
# Pushes made by this workflow's own token do not start new runs, so recording results does not loop.
# Automatic trigger removed 2026-10-27 (Jesse: posts and replies only through the browser); start by hand only.
on:
  workflow_dispatch:
concurrency:
  group: replies
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Send queued replies
        run: python3 scripts/send_replies.py
      - name: Save results
        if: always()
        run: |
          git config user.name "x-ops bot"
          git config user.email "x-ops-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Record reply results"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
