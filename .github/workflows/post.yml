name: post
# Stopped 2026-10-27 (Jesse「所有发帖和回复只能通过浏览器，把github那边的自动任务停掉」): no schedule, and the job
# only runs when started by hand with run_anyway, so cron-job.org dispatches do nothing.
on:
  workflow_dispatch:
    inputs:
      run_anyway:
        description: "Post due queue items through the X API (only if Jesse asks)"
        type: boolean
        default: false
concurrency:
  group: post
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    if: ${{ inputs.run_anyway }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Post due queue items
        run: python3 scripts/post_due.py
      - name: Save results
        if: always()
        run: |
          git config user.name "x-ops bot"
          git config user.email "x-ops-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Record posting results"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
