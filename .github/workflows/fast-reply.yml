name: fast-reply
# Replies to new comments under my own posts (scripts/fast_reply.py), then refreshes user profiles (scripts/people.py). Runs right after every posting run, which
# cron-job.org starts every 5 minutes, so there is no separate timer. Only one run at a time.
# Automatic trigger removed 2026-10-27 (Jesse: posts and replies only through the browser); start by hand only.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only write the replies and print them, send nothing"
        type: boolean
        default: false
concurrency:
  group: fast-reply
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Claude
        if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install -q anthropic
          elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g -s @anthropic-ai/claude-code; fi
      - name: Reply to new comments
        if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
        run: python3 scripts/fast_reply.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Update user profiles
        # profiles of the people who comment most + 中文圈大事记 (scripts/people.py), every people_every_hours
        if: (github.event_name == 'workflow_dispatch' || contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)) && !inputs.dry_run
        continue-on-error: true
        run: python3 scripts/people.py build --if-due
      - name: Save state
        if: always() && !inputs.dry_run
        run: |
          git config user.name "x-ops bot"
          git config user.email "x-ops-bot@users.noreply.github.com"
          git add data/fast_reply data/people
          git diff --cached --quiet && exit 0
          git commit -q -m "Record fast replies"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
